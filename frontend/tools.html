<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetWatch — Tools</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="nav"></div>

  <div class="container">
    <h1>Sysadmin Tools</h1>
    <div class="subtitle">Diagnostics for troubleshooting the network</div>

    <div class="tabs">
      <div class="tab active" data-tab="sweep">Ping Sweep</div>
      <div class="tab" data-tab="portscan">Port Scan</div>
      <div class="tab" data-tab="dns">DNS Lookup</div>
      <div class="tab" data-tab="traceroute">Traceroute</div>
      <div class="tab" data-tab="subnet">Subnet Calculator</div>
    </div>

    <div class="card" id="tab-sweep">
      <div class="toolbar">
        <div class="field">
          <label>Subnet (CIDR)</label>
          <input id="sw_subnet" placeholder="192.168.1.0/24">
        </div>
        <div class="field">
          <label>Or specific IPs (comma-separated)</label>
          <input id="sw_ips" placeholder="127.0.0.1, 8.8.8.8">
        </div>
        <button onclick="runSweep()" id="sweepBtn">Sweep</button>
      </div>
      <div class="status-text" id="sw_status"></div>
      <div id="sw_results"></div>
    </div>

    <div class="card" id="tab-portscan" style="display:none;">
      <div class="toolbar">
        <div class="field"><label>Host / IP</label><input id="ps_host" placeholder="192.168.1.1"></div>
        <div class="field"><label>Ports (optional, comma-separated — default: common ports)</label><input id="ps_ports" placeholder="22,80,443"></div>
        <button onclick="runPortScan()">Scan</button>
      </div>
      <div id="ps_status" class="status-text"></div>
      <div id="ps_results"></div>
    </div>

    <div class="card" id="tab-dns" style="display:none;">
      <div class="toolbar">
        <div class="field"><label>Hostname or IP</label><input id="dns_host" placeholder="example.com"></div>
        <button onclick="runDns()">Lookup</button>
      </div>
      <div id="dns_status" class="status-text"></div>
      <pre class="output" id="dns_results" style="display:none;"></pre>
    </div>

    <div class="card" id="tab-traceroute" style="display:none;">
      <div class="toolbar">
        <div class="field"><label>Host / IP</label><input id="tr_host" placeholder="8.8.8.8"></div>
        <button onclick="runTraceroute()">Trace</button>
      </div>
      <div id="tr_status" class="status-text"></div>
      <pre class="output" id="tr_results" style="display:none;"></pre>
    </div>

    <div class="card" id="tab-subnet" style="display:none;">
      <div class="toolbar">
        <div class="field"><label>CIDR</label><input id="sn_cidr" placeholder="192.168.1.0/24"></div>
        <button onclick="runSubnet()">Calculate</button>
      </div>
      <div id="sn_status" class="status-text"></div>
      <div id="sn_results"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();
    renderNav("tools.html");

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
        document.querySelectorAll(".card[id^='tab-']").forEach(c => c.style.display = "none");
        tab.classList.add("active");
        document.getElementById("tab-" + tab.dataset.tab).style.display = "block";
      });
    });

    async function runSweep() {
      const btn = document.getElementById("sweepBtn");
      const status = document.getElementById("sw_status");
      const results = document.getElementById("sw_results");

      const subnet = document.getElementById("sw_subnet").value.trim();
      const ips = document.getElementById("sw_ips").value.trim();
      const params = new URLSearchParams();
      if (subnet) params.set("subnet", subnet);
      if (ips) params.set("ips", ips);

      btn.disabled = true;
      status.innerText = "Scanning...";
      results.innerHTML = "";

      try {
        const data = await api(`/hosts?${params.toString()}`);
        status.innerText = `Found ${data.alive.length} / ${data.total} hosts online`;

        const grid = document.createElement("div");
        grid.className = "grid grid-4";
        data.details
          .sort((a, b) => (b.alive - a.alive))
          .forEach(d => {
            const div = document.createElement("div");
            div.className = "card stat-card " + (d.alive ? "stat-up" : "stat-down");
            div.innerHTML = `
              <div class="stat-value" style="font-size:16px;">${d.ip}</div>
              <div class="stat-label">${d.status}${d.latency_ms ? " · " + d.latency_ms + "ms" : ""}</div>
            `;
            grid.appendChild(div);
          });
        results.appendChild(grid);
      } catch (err) {
        status.innerText = "";
        results.innerHTML = `<div class="error-text">Error: ${err.message}</div>`;
      }
      btn.disabled = false;
    }

    async function runPortScan() {
      const host = document.getElementById("ps_host").value.trim();
      const portsRaw = document.getElementById("ps_ports").value.trim();
      const status = document.getElementById("ps_status");
      const results = document.getElementById("ps_results");
      if (!host) { status.innerText = "Enter a host."; return; }

      status.innerText = "Scanning...";
      results.innerHTML = "";
      try {
        const params = new URLSearchParams({ host });
        if (portsRaw) params.set("ports", portsRaw);
        const data = await api(`/tools/port-scan?${params.toString()}`);
        status.innerText = `Scanned ${data.scanned} ports on ${data.host} — ${data.open_ports.length} open`;

        if (data.open_ports.length === 0) {
          results.innerHTML = `<div class="status-text">No open ports found.</div>`;
          return;
        }
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        const table = document.createElement("table");
        table.innerHTML = `<thead><tr><th>Port</th><th>Service</th></tr></thead><tbody>
          ${data.open_ports.map(p => `<tr><td>${p.port}</td><td>${p.service}</td></tr>`).join("")}
        </tbody>`;
        wrap.appendChild(table);
        results.appendChild(wrap);
      } catch (err) {
        status.innerText = "";
        results.innerHTML = `<div class="error-text">${err.message}</div>`;
      }
    }

    async function runDns() {
      const host = document.getElementById("dns_host").value.trim();
      const status = document.getElementById("dns_status");
      const results = document.getElementById("dns_results");
      if (!host) { status.innerText = "Enter a hostname or IP."; return; }

      status.innerText = "Looking up...";
      results.style.display = "none";
      try {
        const data = await api(`/tools/dns?host=${encodeURIComponent(host)}`);
        status.innerText = "";
        results.style.display = "block";
        results.innerText = data.ok
          ? `Query: ${data.query}\nIP: ${data.ip}\nReverse DNS: ${data.reverse_dns || "—"}`
          : `Lookup failed: ${data.error}`;
      } catch (err) {
        status.innerText = "";
        results.style.display = "block";
        results.innerText = "Error: " + err.message;
      }
    }

    async function runTraceroute() {
      const host = document.getElementById("tr_host").value.trim();
      const status = document.getElementById("tr_status");
      const results = document.getElementById("tr_results");
      if (!host) { status.innerText = "Enter a host."; return; }

      status.innerText = "Tracing route (this can take a while)...";
      results.style.display = "none";
      try {
        const data = await api(`/tools/traceroute?host=${encodeURIComponent(host)}`);
        status.innerText = "";
        results.style.display = "block";
        results.innerText = data.ok ? data.output : `Error: ${data.error}`;
      } catch (err) {
        status.innerText = "";
        results.style.display = "block";
        results.innerText = "Error: " + err.message;
      }
    }

    async function runSubnet() {
      const cidr = document.getElementById("sn_cidr").value.trim();
      const status = document.getElementById("sn_status");
      const results = document.getElementById("sn_results");
      if (!cidr) { status.innerText = "Enter a CIDR block."; return; }

      status.innerText = "";
      try {
        const data = await api(`/tools/subnet?cidr=${encodeURIComponent(cidr)}`);
        results.innerHTML = `
          <div class="grid grid-3">
            <div class="card stat-card"><div class="stat-value" style="font-size:16px;">${data.network_address}</div><div class="stat-label">Network address</div></div>
            <div class="card stat-card"><div class="stat-value" style="font-size:16px;">${data.broadcast_address || "—"}</div><div class="stat-label">Broadcast address</div></div>
            <div class="card stat-card"><div class="stat-value" style="font-size:16px;">${data.netmask || "—"}</div><div class="stat-label">Netmask</div></div>
            <div class="card stat-card"><div class="stat-value">${data.num_addresses}</div><div class="stat-label">Total addresses</div></div>
            <div class="card stat-card"><div class="stat-value">${data.usable_hosts}</div><div class="stat-label">Usable hosts</div></div>
            <div class="card stat-card"><div class="stat-value" style="font-size:16px;">${data.first_usable} – ${data.last_usable}</div><div class="stat-label">Usable range</div></div>
          </div>`;
      } catch (err) {
        status.innerText = "";
        results.innerHTML = `<div class="error-text">${err.message}</div>`;
      }
    }

    ["sw_subnet","sw_ips","ps_host","dns_host","tr_host","sn_cidr"].forEach(id => {
      document.getElementById(id).addEventListener("keydown", e => {
        if (e.key === "Enter") {
          const activeTab = document.querySelector('.tab.active').dataset.tab;
          if (activeTab === "sweep") { runSweep(); return; }
          document.querySelector(`#tab-${activeTab} button`).click();
        }
      });
    });
  </script>
</body>
</html>
